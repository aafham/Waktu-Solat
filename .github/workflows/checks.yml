name: Check application

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check prayer-data.js
          node --check qibla.js
          node --check zones.js
          node --check service-worker.js
      - name: Test prayer data, compass and offline cache
        run: npm test
