name: Check application

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check prayer-data.js
          node --check location-service.js
          node --check qibla.js
          node --check islamic-calendar.js
          node --check islamic-calendar-data.js
          node --check islamic-references.js
          node --check islamic-calendar-view.js
          node --check event-countdown.js
          node --check zones.js
          node --check service-worker.js
      - name: Test prayer data, compass and offline cache
        run: npm test
      - name: Install browser for integration tests
        run: npx playwright install --with-deps chromium
      - name: Test browser flows and responsive navigation
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
